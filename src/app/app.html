<main>
  <h1>HCI UART Tool</h1>

  @if (!serial.isSupported) {
  <p class="error">Web Serial не підтримується цим браузером. Відкрийте сторінку в Chrome або Edge.</p>
  } @else if (serial.connected()) {
  <button (click)="sendReset()">Send HCI Reset</button>
  <button (click)="disconnect()">Disconnect</button>
  } @else {
  <button (click)="connect()">Connect</button>
  }

  @if (error()) {
  <p class="error">{{ error() }}</p>
  }

  <pre>@for (line of log(); track $index) {{{ line }}
}</pre>
</main>
